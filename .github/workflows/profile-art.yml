# Builds the 3D contribution graph and the contribution snake and publishes
# them to the `output` branch. With a STATS_TOKEN secret it also rebuilds
# assets/stats-*.svg and assets/languages-*.svg on main, private repos included.
name: Profile art

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Stats and languages cards
        if: ${{ env.STATS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          node scripts/stats.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Update stats cards [skip ci]" && git push; }

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # A personal token lets the graph count private repos too.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5b4bff&color_dots=#ebedf0,#d9d4ff,#aea3ff,#7c6cff,#5b4bff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7c6cff&color_dots=#161b22,#2a1f7a,#4a3bc0,#6a5af0,#a99eff

      - name: Collect output
        run: sudo mv profile-3d-contrib dist/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile art
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
