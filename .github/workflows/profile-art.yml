# Builds the 3D contribution graph and the contribution snake,
# then publishes both to the `output` branch that README.md reads from.
name: Profile art

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5b4bff&color_dots=#ebedf0,#d9d4ff,#aea3ff,#7c6cff,#5b4bff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7c6cff&color_dots=#161b22,#2a1f7a,#4a3bc0,#6a5af0,#a99eff

      - name: Collect output
        run: mv profile-3d-contrib dist/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile art
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
