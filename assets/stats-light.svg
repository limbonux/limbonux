<svg xmlns="http://www.w3.org/2000/svg" width="900" height="474" viewBox="0 0 900 474" role="img" aria-label="GitHub in numbers">
<style>
  .in { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .in, .grow { animation: none; opacity: 1; transform: none; } }
</style>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5b4bff"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
  <clipPath id="r"><rect width="900" height="474" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
